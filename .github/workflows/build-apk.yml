name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform scaffold
        run: |
          flutter create . --org com.bwpexperts --project-name ai_diet_coach --platforms android
          # App display name
          sed -i 's/android:label="ai_diet_coach"/android:label="AI Diet Coach"/' android/app/src/main/AndroidManifest.xml
          # Internet permission (API calls)
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons from brand logo
        run: dart run flutter_launcher_icons

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze (non-blocking on first runs)
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Run tests
        run: flutter test
        continue-on-error: true

      # Demo build: runs standalone with clearly-labeled dev fakes (no backend needed).
      - name: Build demo APK
        run: |
          flutter build apk --release --dart-define=USE_FAKE_API=true
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/ai-diet-coach-demo.apk

      # Backend-connected build: set API_BASE_URL repo variable to your server URL.
      - name: Build API-connected APK
        run: |
          flutter build apk --release --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'http://10.0.2.2:8000/api/v1' }}
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/ai-diet-coach-api.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ai-diet-coach-apks
          path: mobile/build/app/outputs/flutter-apk/ai-diet-coach-*.apk
          retention-days: 30
